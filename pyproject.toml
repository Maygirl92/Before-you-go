[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "before-you-go-data"
version = "0.1.0"
description = "Data foundation for Before You Go: Europe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/before_you_go"]

